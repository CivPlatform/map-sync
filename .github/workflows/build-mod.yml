name: "Build Mods"

on:
  push:
    paths:
      - "mod/**/*"
  pull_request:
    paths:
      - "mod/**/*"
  workflow_call:

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Setting up JDK 17"
        uses: "actions/setup-java@v4"
        with:
          java-version: "17"
          distribution: "adopt"

      - name: "Building mods"
        working-directory: "./mod"
        run: "./gradlew build"
