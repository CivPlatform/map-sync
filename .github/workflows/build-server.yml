name: "Build+Test Server"

on:
  push:
    paths:
      - "server/**/*"
  pull_request:
    paths:
      - "server/**/*"
  workflow_call:

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Setting up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Installing dependencies"
        working-directory: "./server"
        run: "bun install"

      - name: "Checking types"
        working-directory: "./server"
        run: "bun run check:types"

      - name: "Checking style"
        working-directory: "./server"
        run: "bun run check:style"

      - name: "Running tests"
        working-directory: "./server"
        run: "bun run test"
